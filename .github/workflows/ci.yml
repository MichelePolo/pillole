# Il nome del job ("typecheck") è il controllo richiesto dal ruleset di main.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# Su una PR un nuovo push rende inutile il run precedente; su main no:
# ogni commit unito deve avere il suo controllo completo.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json
      # --ignore-scripts: lo script di onnxruntime-node (dentro @huggingface/transformers) scarica
      # binari da un server esterno e a volte va in timeout. Serve solo a «npm run embed», sul PC.
      - run: npm ci --ignore-scripts
      # Non ci sono ancora test: per ora la CI verifica i tipi.
      - run: npm run typecheck
      - run: npm test --if-present

  app:
    name: app build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json
      # build-index.ts importa il parser del passo 1: servono anche le dipendenze della radice.
      # --ignore-scripts: lo script di onnxruntime-node (dentro @huggingface/transformers) scarica
      # binari da un server esterno e a volte va in timeout. Serve solo a «npm run embed», sul PC.
      - run: npm ci --ignore-scripts
      - run: npm ci
        working-directory: app
      - run: npm run build
        working-directory: app
