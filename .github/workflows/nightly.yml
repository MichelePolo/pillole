# Job notturno: legge i feed di feeds.txt, distilla gli articoli nuovi con l'API batch
# (metà prezzo), scarta i duplicati e apre una PR "chore: idee della notte" da rivedere.
# Se la PR di una notte precedente è ancora aperta, le idee nuove si aggiungono a quella:
# nessun giro si salta, e la revisione si fa quando capita.
# La revisione si fa in locale sul ramo della PR (npm run review), poi si unisce la PR
# e si pubblica l'app (Actions → deploy → Run workflow).
#
# Serve il secret ANTHROPIC_API_KEY. Le PR aperte con GITHUB_TOKEN non fanno partire la CI:
# i controlli richiesti girano al primo push della revisione sul ramo.
name: nightly

on:
  schedule:
    - cron: '17 2 * * *' # 3:17 in Italia (4:17 con l'ora legale)
  workflow_dispatch:
    inputs:
      max:
        description: Articoli nuovi per feed
        default: '3'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: nightly
  cancel-in-progress: false

# bash con pipefail: senza, un errore prima di «| tee» passerebbe inosservato.
defaults:
  run:
    shell: bash

jobs:
  nightly:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      # Se c'è una PR della notte ancora aperta, il giro continua sul suo ramo: lo stato dei feed
      # (library/feeds.json) sta lì, e ripartire da main sceglierebbe di nuovo gli stessi articoli.
      - name: PR della notte ancora aperta?
        id: open
        run: |
          # Contano solo le PR del bot da rami di questo repository: una PR da un fork con un
          # ramo chiamato chore/notte-… non deve poter decidere su quale ramo lavora il job.
          branch=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --author 'app/github-actions' --json headRefName,isCrossRepository,createdAt \
            --jq '[.[] | select(.isCrossRepository == false and (.headRefName | startswith("chore/notte-")))] | sort_by(.createdAt) | .[0].headRefName // ""')
          if [ -n "$branch" ] && ! [[ "$branch" =~ ^chore/notte-[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then echo "Nome del ramo inatteso: $branch"; exit 1; fi
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          if [ -n "$branch" ]; then echo "::notice::La PR della notte su $branch è ancora aperta: le idee nuove si aggiungono lì."; fi

      # Tutta la storia: serve per unire main nel ramo della PR aperta.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      # Sul ramo della PR aperta, con dentro main: così il giro usa feeds.txt e il codice aggiornati.
      # Se l'unione non riesce (conflitto), il job si ferma: meglio un errore visibile che un giro
      # sullo stato sbagliato.
      - name: Ramo di lavoro
        env:
          BRANCH: ${{ steps.open.outputs.branch }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ -z "$BRANCH" ]; then exit 0; fi
          git switch -q "$BRANCH"
          if ! git merge -q --no-edit origin/main; then
            git merge --abort
            echo "::error::Il ramo $BRANCH non si unisce con main: rivedi e unisci la PR, poi rilancia il job."
            exit 1
          fi

      # --ignore-scripts: lo script di onnxruntime-node scarica solo le librerie CUDA;
      # quelle per CPU, che bastano agli embedding, sono già nel pacchetto.
      - run: npm ci --ignore-scripts
      # Il modello degli embedding (~120 MB) si scarica una volta sola.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/@huggingface/transformers/.cache
          key: transformers-multilingual-e5-small-q8

      - name: Feed
        env:
          MAX: ${{ inputs.max || '3' }}
        run: |
          if ! [[ "$MAX" =~ ^[1-9][0-9]?$ ]]; then echo "max deve essere un numero da 1 a 99"; exit 1; fi
          # I titoli vengono da pagine web: mentre girano, il runner ignora i comandi "::…::".
          token=$(openssl rand -hex 16)
          echo "::stop-commands::$token"
          npm run -s feeds -- --out "$RUNNER_TEMP/queue.txt" --max "$MAX" | tee "$RUNNER_TEMP/feeds.log"
          echo "::$token::"

      - name: Distillazione (batch) e controllo duplicati
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ ! -s "$RUNNER_TEMP/queue.txt" ]; then echo "Nessun articolo nuovo." | tee "$RUNNER_TEMP/distill.log"; exit 0; fi
          token=$(openssl rand -hex 16)
          echo "::stop-commands::$token"
          npm run -s distill -- --batch "$RUNNER_TEMP/queue.txt" 2>&1 | tee "$RUNNER_TEMP/distill.log"
          echo "::$token::"

      - name: PR con le idee della notte
        env:
          BRANCH: ${{ steps.open.outputs.branch }}
        run: |
          git add library
          if git diff --cached --quiet; then echo "Niente di nuovo."; exit 0; fi
          day=$(date -u +%F)
          if [ -z "$BRANCH" ]; then git switch -q -c "chore/notte-$day"; fi
          branch=$(git branch --show-current)
          git commit -q -m "chore: idee della notte del $day"
          ideas=$(git diff --name-only --diff-filter=A HEAD~1 -- library/ideas | wc -l)
          # Se nel frattempo è arrivata una revisione sul ramo, la si unisce prima di spingere.
          if [ -n "$BRANCH" ]; then
            git fetch -q origin "$branch"
            if ! git merge -q --no-edit "origin/$branch"; then
              git merge --abort
              echo "::error::Il ramo $branch è cambiato durante il giro e non si unisce: rilancia il job."
              exit 1
            fi
          fi
          git push -q -u origin "$branch"
          {
            if [ -n "$BRANCH" ]; then
              echo "Idee della notte del $day aggiunte a questa PR: **$ideas file nuovi**."
            else
              echo "Idee distillate stanotte dai feed di \`feeds.txt\`: **$ideas file nuovi**."
              echo
              echo "Per rivederle:"
              echo
              echo '```bash'
              echo "git fetch && git switch $branch"
              echo 'npm run review            # le idee nuove'
              echo 'npm run review -- --auto  # gli scarti automatici dei duplicati, se vuoi controllarli'
              echo 'git commit -am "chore: revisione" && git push'
              echo '```'
              echo
              echo 'Il push della revisione fa partire la CI. Poi unisci la PR e pubblica l'"'"'app (Actions → deploy → Run workflow).'
              echo 'Se la PR resta aperta, le notti successive aggiungono qui le loro idee: prima di rivedere, `git pull`.'
            fi
            echo
            echo '<details><summary>Registro</summary>'
            echo
            echo '```text'
            # Titoli e messaggi vengono da pagine web: niente backtick che chiudano il blocco.
            cat "$RUNNER_TEMP/feeds.log" "$RUNNER_TEMP/distill.log" | tr -d '`' | tail -c 60000
            echo '```'
            echo '</details>'
          } > "$RUNNER_TEMP/body.md"
          if [ -n "$BRANCH" ]; then
            gh pr comment "$branch" --body-file "$RUNNER_TEMP/body.md"
          else
            gh pr create --base main --head "$branch" --title "chore: idee della notte del $day" --body-file "$RUNNER_TEMP/body.md"
          fi
